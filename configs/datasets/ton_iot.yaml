id: ton_iot
source_url: https://research.unsw.edu.au/projects/toniot-datasets
download_url: https://unsw-my.sharepoint.com/
accessed: '2026-09-21'
format: csv
raw_subdirectory: TON_IoT Network Dataset
glob: '*.csv'
target: label
benign_labels: [0, '0', normal, Normal]
sample_max_rows: null
recommended_sample_size: full_after_duplicate_policy
duplicate_policy: deduplicate_then_stratified
cross_label_duplicate_policy: exclude_conflicting_fingerprints
split: {train: 0.70, validation: 0.15, test: 0.15, seed: 42}
feature_policy:
  remove: [src_ip, dst_ip, dns_query, ssl_subject, ssl_issuer, ssl_version, ssl_cipher, ssl_resumed, ssl_established, http_uri, http_user_agent, http_trans_depth, http_method, http_version, http_request_body_len, http_response_body_len, http_status_code, http_orig_mime_types, http_resp_mime_types, weird_name, weird_addl, weird_notice, label, type, source_file]
  immutable: [proto, service, conn_state, http_version, weird_notice]
  categorical: [proto, service, conn_state, type]
  semantically_constrained: [src_port, dst_port]
  mutable: []
  note: Network data only; no feature is independently mutable and numerical traffic fields require joint projection.
  model_numeric: [src_port, dst_port, duration, src_bytes, dst_bytes, missed_bytes, src_pkts, src_ip_bytes, dst_pkts, dst_ip_bytes, dns_qclass, dns_qtype, dns_rcode]
  model_categorical: [proto, service, conn_state, dns_AA, dns_RD, dns_RA, dns_rejected]
  attack_conditionally_mutable: [duration, src_bytes, dst_bytes, missed_bytes, src_pkts, src_ip_bytes, dst_pkts, dst_ip_bytes]
